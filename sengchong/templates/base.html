<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}成昌家私{% endblock %}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" href="{{ url_for('static', filename='images/logo/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
</head>
<body>
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='images/logo/logo.png') }}" alt="Logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">主页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/products">产品</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id='base_container'>
        <p id='sever_API'></p>
        <div class="box"></div>
        {% block content %}
        {% endblock %}
    </div>
    <footer>
        {% include 'footer.html' %}
      </footer>
    <script>
    (function () {
        function setText(selector, value) {
            const element = document.querySelector(selector);
            if (!element) return;
            element.textContent = value || "";
            element.hidden = !value;
        }

        function renderFooter(payload) {
            const footer = payload && payload.footer ? payload.footer : {};
            const companyName = footer.company_name || "Seng Chong Interior Design";
            const year = footer.year ? footer.year + " " : "";

            setText("[data-footer-company]", year + companyName + ". All rights reserved.");
            setText("[data-footer-registration]", footer.registration_no || "");
            setText("[data-footer-address]", footer.address || "");
            setText(
                "[data-footer-contact]",
                footer.contact_person ? "Contact Person: " + footer.contact_person : ""
            );
            setText("[data-footer-phone]", footer.phone ? "Phone: " + footer.phone : "");
            setText(
                "[data-footer-hours]",
                footer.business_hours ? "Business hours: " + footer.business_hours : ""
            );
        }

        window.loadSengchongWebsite = function () {
            if (!window.__sengchongWebsitePayload) {
                window.__sengchongWebsitePayload = fetch("/public-api/website", {
                    headers: { "Accept": "application/json" }
                }).then(function (response) {
                    if (!response.ok) {
                        throw new Error("Failed to load website content");
                    }
                    return response.json();
                });
            }
            return window.__sengchongWebsitePayload;
        };

        document.addEventListener("DOMContentLoaded", function () {
            window.loadSengchongWebsite()
                .then(function (payload) {
                    renderFooter(payload);
                    document.dispatchEvent(
                        new CustomEvent("sengchong:website", { detail: payload })
                    );
                })
                .catch(function (error) {
                    console.error("Error loading website content:", error);
                });
        });
    })();
    </script>
</body>
</html>
